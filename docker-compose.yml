version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: takeup-db
    environment:
      POSTGRES_USER: takeup_user
      POSTGRES_PASSWORD: takeup_password
      POSTGRES_DB: takeup_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: takeup-redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
